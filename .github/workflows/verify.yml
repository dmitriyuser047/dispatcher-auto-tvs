name: Verify
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use the canonical Windows temporary directory
        shell: pwsh
        run: |
          $canonicalTemp = node -e "process.stdout.write(require('node:fs').realpathSync.native(require('node:os').tmpdir()))"
          if ($LASTEXITCODE -ne 0 -or -not $canonicalTemp) { throw 'Cannot resolve the temporary directory' }
          "TEMP=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Install isolated browser tools
        run: npm install --prefix "${{ runner.temp }}/tvs-ui-tools" --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: node "${{ runner.temp }}/tvs-ui-tools/node_modules/playwright/cli.js" install chromium
      - run: npm run test:ui
        env:
          TVS_PLAYWRIGHT_MODULES: ${{ runner.temp }}/tvs-ui-tools/node_modules
      - run: npm run test:electron
        env:
          TVS_PLAYWRIGHT_MODULES: ${{ runner.temp }}/tvs-ui-tools/node_modules
