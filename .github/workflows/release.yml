name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test fuel accounting
        run: npm test

      - name: Install isolated browser test tools
        run: npm install --prefix "${{ runner.temp }}/tvs-ui-tools" --no-save --package-lock=false playwright@1.62.1

      - name: Install test browser
        run: node "${{ runner.temp }}/tvs-ui-tools/node_modules/playwright/cli.js" install chromium

      - name: Test forms, deletion, imports and calculations in browser
        env:
          TVS_PLAYWRIGHT_MODULES: ${{ runner.temp }}/tvs-ui-tools/node_modules
        run: npm run test:ui

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never

      - name: Get version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v  = "${{ steps.pkg.outputs.version }}"
          $md = Get-Content assets/CHANGELOG.md -Raw -Encoding UTF8
          $m  = [regex]::Match($md, "(?ms)^## " + [regex]::Escape($v) + "\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim()
          if (-not $notes) { $notes = "Доступна версия $v." }
          [System.IO.File]::WriteAllText("release-notes.md", "## Версия $v`n`n$notes`n`nСкачайте и запустите установщик ниже.", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText("release-notes.txt", $notes, [System.Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release & upload installer
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.pkg.outputs.version }}"
          body_path: release-notes.md
          files: dist/Dispatcher-Setup-${{ steps.pkg.outputs.version }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push version.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --rebase origin main
          $v    = "${{ steps.pkg.outputs.version }}"
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $url  = "https://github.com/$repo/releases/download/$tag/Dispatcher-Setup-$v.exe"
          $date = Get-Date -Format "yyyy-MM-dd"
          $json = [ordered]@{
            version = $v
            date    = $date
            notes   = "Что нового:`n" + [System.IO.File]::ReadAllText("release-notes.txt") + "`n`nНажмите «Скачать обновление»."
            url     = $url
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("version.json", $json, [System.Text.UTF8Encoding]::new($false))
          git add version.json
          git commit -m "chore: release ${{ github.ref_name }}"
          git push origin main
