<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Реестр счетов</title>
<style>
  :root {
    --bg: #f0f4f8; --bg2: #ffffff; --bg3: #e8edf3; --bg4: #dde3ec;
    --accent: #2563eb; --accent2: #1d4ed8; --green: #16a34a; --red: #dc2626;
    --text: #1e293b; --text2: #475569; --text3: #94a3b8;
    --border: #cbd5e1; --border2: #b0bec5; --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.12);
  }
  [data-theme="dark"] {
    --bg: #0f1117; --bg2: #171a21; --bg3: #1f242e; --bg4: #262c38;
    --accent: #3b82f6; --accent2: #2563eb; --green: #22c55e; --red: #ef4444;
    --text: #e5ebf3; --text2: #a3b1c2; --text3: #6b7889;
    --border: #2a303c; --border2: #3a4150;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 16px; font-weight: 700; }
  .toolbar .summary { font-size: 13px; color: var(--text2); }
  .toolbar-spacer { flex: 1; }
  .toolbar-row2 {
    width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 4px;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .toolbar-row2 label { font-size: 12px; color: var(--text2); font-weight: 600; white-space: nowrap; }
  .toolbar-row2 select {
    padding: 4px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg2); color: var(--text); font-family: inherit; min-width: 180px;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 7px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { opacity: 0.9; }

  .content { flex: 1; overflow: auto; padding: 16px 20px; }

  .log-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 16px;
  }
  .log-card summary {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text2);
    user-select: none; list-style: none;
  }
  .log-card summary::before { content: '▸ '; }
  .log-card[open] summary::before { content: '▾ '; }
  .log-list { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .log-item { font-size: 12px; padding: 2px 0; }
  .log-ok { color: var(--green); } .log-ok::before { content: '✓ '; }
  .log-warn { color: var(--red); } .log-warn::before { content: '! '; }
  .log-info { color: var(--text3); } .log-info::before { content: '· '; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1550px; }
  thead tr { background: var(--accent); color: #fff; }
  th { padding: 8px; text-align: left; font-weight: 600; white-space: nowrap; }
  .table-wrap {
    overflow-x: auto; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg2);
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0; font-size: 14px; font-weight: 700;
  }

  .action-btn {
    background: none; border: none; cursor: pointer; border-radius: 4px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .action-btn:hover { background: var(--bg4); }
  .action-btn.delete { color: var(--text3); }
  .action-btn.delete:hover { color: var(--red); background: rgba(220,38,38,0.08); }

  .done-card {
    background: var(--bg2); border: 1px solid var(--green); border-radius: var(--radius);
    padding: 20px; margin-top: 16px; display: none;
  }
  .done-card .done-info { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }

  /* Searchable dropdown — reused for statya, contract, object */
  .dd-picker { position: relative; min-width: 140px; }
  .dd-selected {
    width: 100%; padding: 4px 24px 4px 6px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg2); color: var(--text); cursor: pointer;
    font-family: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 24px; display: flex; align-items: center;
  }
  .dd-selected::after {
    content: '▾'; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--text3); pointer-events: none;
  }
  .dd-dropdown {
    display: none; position: fixed;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: var(--shadow); z-index: 1000; max-height: 280px;
    flex-direction: column; width: 320px;
  }
  .dd-dropdown.open { display: flex; }
  .dd-search {
    padding: 6px 8px; border: none; border-bottom: 1px solid var(--border);
    font-size: 12px; font-family: inherit; background: var(--bg);
    color: var(--text); outline: none; border-radius: 6px 6px 0 0;
  }
  .dd-search::placeholder { color: var(--text3); }
  .dd-options { overflow-y: auto; max-height: 240px; }
  .dd-group { padding: 4px 8px; font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; }
  .dd-option {
    padding: 5px 8px; font-size: 11px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dd-option:hover { background: var(--bg3); }
  .dd-option.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 600; }
  .dd-option.hidden { display: none; }
  .dd-option .co-obj { font-size: 10px; color: var(--text3); margin-left: 4px; }

  .razdel-sel {
    width: 100%; padding: 3px 5px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg2); color: var(--text); font-family: inherit;
  }

  .spinner {
    display: none; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Реестр счетов</h1>
  <span class="summary" id="summaryCount"></span>
  <span class="summary" id="summaryAmount"></span>
  <span class="toolbar-spacer"></span>
  <button class="btn btn-ghost" id="addRowBtn">+ Строка</button>
  <button class="btn btn-green" id="saveBtn">Сохранить</button>
  <button class="btn btn-primary" id="buildBtn">
    <span class="spinner" id="buildSpinner"></span>
    <span id="buildBtnLabel">Сформировать реестр</span>
  </button>

</div>

<div class="content">
  <details class="log-card" id="logCard" style="display:none">
    <summary id="logSummary">Лог распознавания</summary>
    <div class="log-list" id="logList"></div>
  </details>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:36px">№</th>
        <th style="width:100px">Сумма</th>
        <th style="min-width:140px">Описание</th>
        <th style="width:120px">Раздел</th>
        <th style="width:120px">Компания</th>
        <th style="min-width:130px">Контрагент</th>
        <th style="width:140px">Объект</th>
        <th style="min-width:180px">Статья БДДС</th>
        <th style="width:140px">Тип оплаты</th>
        <th style="min-width:160px">Договор</th>
        <th style="width:36px"></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="total-row">
    <span style="color:var(--text2)">Итого:</span>
    <span id="totalAmount">0,00 руб.</span>
  </div>

  <div class="done-card" id="doneCard">
    <div class="done-info">
      <span id="doneCount" style="font-size:16px;font-weight:700">—</span>
      <span id="doneAmount" style="font-size:13px;color:var(--text2)"></span>
    </div>
    <button class="btn btn-primary" id="downloadBtn" style="width:100%;justify-content:center">Скачать реестр.xlsx</button>
  </div>
</div>

<script>
const theme = localStorage.getItem('theme');
if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

const RAZDELY = ['Логистика', 'ТО и ремонт', 'Аренда', 'Офисные платежи', 'ГСМ ДЭС и авто'];
const PAY_TYPES = ['ОПЛАТА ПО ФАКТУ', 'ОПЛАТА 50%', 'ПРЕДОПЛАТА 100%', 'ПРЕДОПЛАТА 50%'];

let rows = [];
let statyi = [];
let contracts = [];
let lastResult = null;
let activeDropdown = null;

document.addEventListener('click', (e) => {
  if (activeDropdown && !activeDropdown.parentElement.contains(e.target)) {
    activeDropdown.classList.remove('open');
    activeDropdown = null;
  }
});

function getUniqueCompanies() {
  const set = new Set();
  contracts.forEach(c => { if (c.company) set.add(c.company); });
  return [...set];
}

function getUniqueObjects() {
  const set = new Set();
  contracts.forEach(c => { if (c.obj) set.add(c.obj); });
  return [...set].sort();
}

function matchContract(objText) {
  if (!objText || !contracts.length) return '';
  const t = objText.toLowerCase();
  let best = null;
  let bestLen = 0;
  for (const c of contracts) {
    if (!c.contract) continue;
    const words = c.obj.toLowerCase().split(/[\s,./]+/).filter(w => w.length > 2);
    let matched = 0;
    for (const w of words) {
      if (t.includes(w)) matched++;
    }
    if (matched > bestLen) { bestLen = matched; best = c; }
  }
  if (bestLen >= 1 && best) return best.contract;
  return '';
}


async function init() {
  const d = await window.reestrWindow.getData();
  rows = d.rows || [];
  statyi = d.statyi || [];
  contracts = d.contracts || [];
  rows.forEach(r => {
    if (!r.dog && r.obj) r.dog = matchContract(r.obj);
    if (!r.razdel) r.razdel = '';
  });
  renderLog(d.log);
  renderTable();
  updateSummary();
}

function renderLog(entries) {
  if (!entries || !entries.length) return;
  const card = document.getElementById('logCard');
  card.style.display = '';
  const list = document.getElementById('logList');
  list.innerHTML = '';
  const ok = entries.filter(e => e.type === 'ok').length;
  const warn = entries.filter(e => e.type === 'warn').length;
  document.getElementById('logSummary').textContent =
    `Лог распознавания — ${ok} успешно` + (warn ? `, ${warn} с предупреждениями` : '');
  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'log-item log-' + (e.type || 'info');
    div.textContent = e.text;
    list.appendChild(div);
  });
}

function updateSummary() {
  document.getElementById('summaryCount').textContent = rows.length + ' строк';
  const total = rows.reduce((s, r) => s + (r.sum || 0), 0);
  document.getElementById('summaryAmount').textContent = total.toLocaleString('ru-RU', { minimumFractionDigits: 2 }) + ' руб.';
  document.getElementById('totalAmount').textContent = total.toLocaleString('ru-RU', { minimumFractionDigits: 2 }) + ' руб.';
}

function buildDropdownPicker(currentVal, items, placeholder, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'dd-picker';
  const selected = document.createElement('div');
  selected.className = 'dd-selected';
  selected.textContent = currentVal || placeholder;
  if (!currentVal) selected.style.color = 'var(--text3)';

  const dropdown = document.createElement('div');
  dropdown.className = 'dd-dropdown';

  const search = document.createElement('input');
  search.className = 'dd-search';
  search.type = 'text';
  search.placeholder = 'Поиск…';
  dropdown.appendChild(search);

  const optionsWrap = document.createElement('div');
  optionsWrap.className = 'dd-options';

  const emptyOpt = document.createElement('div');
  emptyOpt.className = 'dd-option' + (!currentVal ? ' selected' : '');
  emptyOpt.textContent = placeholder;
  emptyOpt.dataset.value = '';
  optionsWrap.appendChild(emptyOpt);

  let hasGroups = false;
  items.forEach(item => {
    if (item.group) {
      hasGroups = true;
      const g = document.createElement('div');
      g.className = 'dd-group';
      g.textContent = item.group;
      optionsWrap.appendChild(g);
    } else {
      const opt = document.createElement('div');
      opt.className = 'dd-option' + (currentVal === item.value ? ' selected' : '');
      opt.innerHTML = item.html || item.label;
      opt.dataset.value = item.value;
      opt.dataset.search = (item.search || item.label).toLowerCase();
      optionsWrap.appendChild(opt);
    }
  });

  if (currentVal && !optionsWrap.querySelector('.dd-option.selected')) {
    const custom = document.createElement('div');
    custom.className = 'dd-option selected';
    custom.textContent = currentVal + ' (авто)';
    custom.dataset.value = currentVal;
    custom.dataset.search = currentVal.toLowerCase();
    optionsWrap.insertBefore(custom, optionsWrap.children[1]);
  }

  dropdown.appendChild(optionsWrap);
  wrap.appendChild(selected);
  wrap.appendChild(dropdown);

  selected.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activeDropdown && activeDropdown !== dropdown) activeDropdown.classList.remove('open');
    dropdown.classList.toggle('open');
    activeDropdown = dropdown.classList.contains('open') ? dropdown : null;
    if (activeDropdown) {
      const rect = selected.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      if (spaceBelow < 200) {
        dropdown.style.bottom = (window.innerHeight - rect.top + 2) + 'px';
        dropdown.style.top = 'auto';
      } else {
        dropdown.style.top = (rect.bottom + 2) + 'px';
        dropdown.style.bottom = 'auto';
      }
      dropdown.style.left = Math.min(rect.left, window.innerWidth - 330) + 'px';
      search.value = '';
      filterOpts('');
      search.focus();
    }
  });

  search.addEventListener('input', () => filterOpts(search.value.toLowerCase()));
  search.addEventListener('click', (e) => e.stopPropagation());

  function filterOpts(query) {
    optionsWrap.querySelectorAll('.dd-option').forEach(opt => {
      if (!query || opt.dataset.value === '' || (opt.dataset.search && opt.dataset.search.includes(query))) {
        opt.classList.remove('hidden');
      } else {
        opt.classList.add('hidden');
      }
    });
    if (hasGroups) {
      optionsWrap.querySelectorAll('.dd-group').forEach(g => {
        let next = g.nextElementSibling;
        let hasVisible = false;
        while (next && !next.classList.contains('dd-group')) {
          if (next.classList.contains('dd-option') && !next.classList.contains('hidden')) hasVisible = true;
          next = next.nextElementSibling;
        }
        g.style.display = hasVisible ? '' : 'none';
      });
    }
  }

  optionsWrap.addEventListener('click', (e) => {
    const opt = e.target.closest('.dd-option');
    if (!opt) return;
    e.stopPropagation();
    optionsWrap.querySelectorAll('.dd-option.selected').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    const val = opt.dataset.value;
    onSelect(val);
    selected.textContent = val || placeholder;
    selected.style.color = val ? '' : 'var(--text3)';
    dropdown.classList.remove('open');
    activeDropdown = null;
  });

  return wrap;
}

function buildStatyaItems() {
  const items = [];
  const groups = {};
  statyi.forEach(s => { const g = s.vid || 'Прочее'; if (!groups[g]) groups[g] = []; groups[g].push(s); });
  for (const [gName, list] of Object.entries(groups)) {
    items.push({ group: gName });
    list.forEach(s => items.push({ value: s.label, label: s.label, search: s.label }));
  }
  return items;
}

function buildContractItems() {
  const items = [];
  const groups = {};
  contracts.forEach(c => { const g = c.company || 'Без компании'; if (!groups[g]) groups[g] = []; groups[g].push(c); });
  for (const [gName, list] of Object.entries(groups)) {
    items.push({ group: gName });
    list.forEach(c => {
      const label = c.contract || '(без номера)';
      items.push({
        value: c.contract,
        label: label,
        html: label + '<span class="co-obj">' + c.obj + '</span>',
        search: c.contract + ' ' + c.obj + ' ' + (c.note || '')
      });
    });
  }
  return items;
}

function buildObjectItems() {
  const items = [];
  getUniqueObjects().forEach(obj => items.push({ value: obj, label: obj, search: obj }));
  return items;
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const statyaItems = buildStatyaItems();
  const contractItems = buildContractItems();
  const objectItems = buildObjectItems();

  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    if (i % 2 === 1) tr.style.background = 'var(--bg3)';

    // №
    const tdN = document.createElement('td');
    tdN.style.cssText = 'padding:6px 8px;text-align:center;font-weight:700;color:var(--text3);border-bottom:1px solid var(--border)';
    tdN.textContent = i + 1;
    tr.appendChild(tdN);

    // Сумма
    const tdS = document.createElement('td');
    tdS.style.cssText = 'padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)';
    const sumInp = document.createElement('input');
    sumInp.type = 'text';
    sumInp.value = (row.sum || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2 });
    sumInp.style.cssText = 'width:90px;text-align:right;padding:3px 5px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text);font-family:inherit;font-weight:700';
    sumInp.addEventListener('change', () => {
      const v = parseFloat(sumInp.value.replace(/\s/g, '').replace(',', '.'));
      rows[i].sum = isNaN(v) ? 0 : v;
      sumInp.value = rows[i].sum.toLocaleString('ru-RU', { minimumFractionDigits: 2 });
      updateSummary();
    });
    tdS.appendChild(sumInp);
    tr.appendChild(tdS);

    // Описание
    const tdD = document.createElement('td');
    tdD.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    const descInp = document.createElement('textarea');
    descInp.value = (row.description || '').replace(/\\n/g, '\n');
    descInp.style.cssText = 'width:100%;padding:3px 5px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text);font-family:inherit;resize:vertical;min-height:36px';
    descInp.addEventListener('change', () => { rows[i].description = descInp.value; });
    tdD.appendChild(descInp);
    tr.appendChild(tdD);

    // Раздел
    const tdR = document.createElement('td');
    tdR.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    const razdelSel = document.createElement('select');
    razdelSel.className = 'razdel-sel';
    razdelSel.innerHTML = '<option value="">—</option>' + RAZDELY.map(r => `<option value="${r}"${row.razdel === r ? ' selected' : ''}>${r}</option>`).join('');
    razdelSel.addEventListener('change', () => { rows[i].razdel = razdelSel.value; });
    tdR.appendChild(razdelSel);
    tr.appendChild(tdR);

    // Компания
    const tdComp = document.createElement('td');
    tdComp.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    const compSel = document.createElement('select');
    compSel.className = 'razdel-sel';
    compSel.innerHTML = '<option value="">—</option>' + getUniqueCompanies().map(c => `<option value="${c}"${row.company === c ? ' selected' : ''}>${c}</option>`).join('');
    compSel.addEventListener('change', () => { rows[i].company = compSel.value; });
    tdComp.appendChild(compSel);
    tr.appendChild(tdComp);

    // Поставщик
    const tdSup = document.createElement('td');
    tdSup.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    const supInp = document.createElement('input');
    supInp.type = 'text';
    supInp.value = row.supplier || '';
    supInp.placeholder = 'Контрагент';
    supInp.style.cssText = 'width:100%;padding:3px 5px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text);font-family:inherit';
    supInp.addEventListener('change', () => { rows[i].supplier = supInp.value; });
    tdSup.appendChild(supInp);
    tr.appendChild(tdSup);

    // Объект (dropdown)
    const tdO = document.createElement('td');
    tdO.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    tdO.appendChild(buildDropdownPicker(row.obj, objectItems, '— объект —', (val) => {
      rows[i].obj = val;
      if (val && !rows[i].dog) rows[i].dog = matchContract(val);
    }));
    tr.appendChild(tdO);

    // Статья БДДС
    const tdSt = document.createElement('td');
    tdSt.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    tdSt.appendChild(buildDropdownPicker(row['statья'], statyaItems, '— статья —', (val) => { rows[i]['statья'] = val; }));
    tr.appendChild(tdSt);

    // Тип оплаты
    const tdPay = document.createElement('td');
    tdPay.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    const paySel = document.createElement('select');
    paySel.className = 'razdel-sel';
    paySel.innerHTML = PAY_TYPES.map(p => `<option value="${p}"${(row.payType || 'ОПЛАТА ПО ФАКТУ') === p ? ' selected' : ''}>${p}</option>`).join('');
    paySel.addEventListener('change', () => { rows[i].payType = paySel.value; });
    tdPay.appendChild(paySel);
    tr.appendChild(tdPay);

    // Договор
    const tdDog = document.createElement('td');
    tdDog.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--border)';
    tdDog.appendChild(buildDropdownPicker(row.dog, contractItems, '— договор —', (val) => { rows[i].dog = val; }));
    tr.appendChild(tdDog);

    // Удалить
    const tdDel = document.createElement('td');
    tdDel.style.cssText = 'padding:6px 8px;text-align:center;border-bottom:1px solid var(--border)';
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.className = 'action-btn delete';
    delBtn.addEventListener('click', () => { rows.splice(i, 1); renderTable(); updateSummary(); });
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    tbody.appendChild(tr);
  });
}

document.getElementById('addRowBtn').addEventListener('click', () => {
  rows.push({
    sum: 0,
    date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }),
    category: '', description: '', razdel: '', obj: '', dog: '', osn: '', updLabel: '', 'statья': '',
    company: '', supplier: '', payType: 'ОПЛАТА ПО ФАКТУ', sourceFolder: 'вручную'
  });
  renderTable();
  updateSummary();
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (window.reestrWindow && window.reestrWindow.saveRows) {
    await window.reestrWindow.saveRows(rows);
    const btn = document.getElementById('saveBtn');
    btn.textContent = 'Сохранено';
    setTimeout(() => { btn.textContent = 'Сохранить'; }, 1500);
  }
});

document.getElementById('buildBtn').addEventListener('click', async () => {
  const btn = document.getElementById('buildBtn');
  btn.disabled = true;
  document.getElementById('buildSpinner').style.display = 'inline-block';
  document.getElementById('buildBtnLabel').textContent = 'Формирую…';
  try {
    const d = await window.reestrAPI.buildXlsx({ rows });
    lastResult = d;
    const r = await window.reestrAPI.save(d.filename, d.xlsxBase64);
    if (r.saved) {
      document.getElementById('buildBtnLabel').textContent = 'Сохранено';
      setTimeout(() => { document.getElementById('buildBtnLabel').textContent = 'Сформировать реестр'; }, 2000);
    }
  } catch (e) {
    alert('Ошибка: ' + e.message);
  } finally {
    btn.disabled = false;
    document.getElementById('buildSpinner').style.display = 'none';
  }
});

document.getElementById('downloadBtn').addEventListener('click', async () => {
  if (!lastResult) return;
  const r = await window.reestrAPI.save(lastResult.filename, lastResult.xlsxBase64);
  if (r.saved) {
    const btn = document.getElementById('downloadBtn');
    btn.textContent = 'Сохранено';
    setTimeout(() => { btn.textContent = 'Скачать реестр.xlsx'; }, 2000);
  }
});

init();
</script>
</body>
</html>
